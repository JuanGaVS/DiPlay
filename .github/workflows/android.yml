name: Android checks
on:
  push:
    # test/** branches build an installable debug APK for on-car testing (same as DiAuto).
    branches: [main, 'test/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        run: set -o pipefail; ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace 2>&1 | tee gradle.log
      # Surface failing tests and lint errors as annotations, readable without downloading logs.
      - name: Annotate failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          out = []
          try:
              lines = open('gradle.log', errors='replace').read().splitlines()
              for i, l in enumerate(lines):
                  if l.startswith('e: ') or l.startswith('* What went wrong'):
                      out.append(' '.join(x.strip() for x in lines[i:i + 3])[:400])
          except OSError:
              pass
          for f in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      msg = (bad.get('message') or bad.text or '').strip().replace('\n', ' ')[:300]
                      out.append(f"{case.get('classname')}.{case.get('name')}: {msg}")
          for f in glob.glob('**/build/reports/lint-results-*.xml', recursive=True):
              for issue in ET.parse(f).getroot().iter('issue'):
                  if issue.get('severity') in ('Error', 'Fatal'):
                      loc = issue.find('location')
                      where = f"{loc.get('file')}:{loc.get('line')}" if loc is not None else f
                      out.append(f"lint {issue.get('id')} {where}: {issue.get('message')}"[:400])
          for line in out[:10] or ['No failing tests or lint errors found; see the Gradle log']:
              print('::error::' + line.replace('%', '%25').replace('\r', ' '))
          PY
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diplay-debug-apk
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
